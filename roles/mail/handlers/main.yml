---
# Mail role handlers

- name: restart dovecot
  service:
    name: dovecot
    state: restarted

# Must stay below "restart dovecot": handlers run in this order. Queues every
# mailbox for the indexer; messages that are already indexed are skipped.
- name: index mailboxes
  shell:
    cmd: doveadm index -A -q '*'

- name: restart postfwd
  service:
    name: postfwd
    state: restarted

- name: restart postfix
  service:
    name: postfix
    state: restarted

- name: restart spamass-milter
  service:
    name: spamass-milter
    state: restarted

- name: restart spamassassin
  service:
    name: spamd
    state: restarted

- name: Restart spamassassin with daemon reload
  systemd:
    name: spamd
    daemon_reload: yes
    state: restarted

- name: restart fail2ban
  service:
    name: fail2ban
    state: restarted

- name: restart opendkim
  service:
    name: opendkim
    state: restarted