# Webmail password guessing. SOGo logs failed webmail logins in its own log,
# with the client's address as filter.d/sogo-auth.local reads it. Calendar,
# contact and ActiveSync logins are throttled by SOGo itself (sogo.conf).
[sogo-auth]
enabled  = true
# Ubuntu's fail2ban reads the systemd journal by default, and SOGo doesn't log there.
backend  = auto
port     = http,https
logpath  = /var/log/sogo/sogo.log
maxretry = 5
findtime = 600
# Not forever, unlike the mail jails. A webmail failure comes from the
# browser's address, which has no IMAP history, so f2b-mail-ignore.sh cannot
# tell a guesser from someone mistyping their own password and would ban both.
# An hour stops a guesser without locking a customer out of webmail for good.
bantime  = 1h
