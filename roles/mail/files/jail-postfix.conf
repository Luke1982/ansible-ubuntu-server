# SMTP password guessing. The stock [postfix] jail runs in mode "more", which
# only matches rejected relay/recipient attempts; mode "auth" matches failed
# SASL logins.
[postfix]
enabled      = true
mode         = auth
port         = smtp,465,587
# Ubuntu's fail2ban reads the systemd journal. Postfix runs as the
# postfix@-.service instance, so the filter's default postfix.service
# match would never see a log line.
backend      = systemd
journalmatch = _SYSTEMD_UNIT=postfix@-.service
maxretry     = 5
findtime     = 600
bantime      = -1
# As in the dovecot jail. A device that sends with a stale password usually
# collects it too, so the script judges this address on its IMAP history.
ignorecommand = /usr/local/sbin/f2b-mail-ignore.sh <ip>
