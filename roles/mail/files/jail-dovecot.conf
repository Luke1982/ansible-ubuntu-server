# IMAP password guessing, using the stock dovecot filter. SOGo logs in to IMAP
# from localhost, which fail2ban ignores, so webmail attempts are banned by the
# sogo-auth jail instead.
[dovecot]
enabled  = true
maxretry = 5
findtime = 600
bantime  = -1
# Banning forever is only safe because of this: before each ban, fail2ban asks
# whether the address belongs to a customer whose mail client still has an old
# password saved. See files/f2b-mail-ignore.sh.
ignorecommand = /usr/local/sbin/f2b-mail-ignore.sh <ip>
