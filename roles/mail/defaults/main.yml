---
# Dovecot version in the default repos of each Ubuntu release. 2.4 changed the
# config format, so each version gets its own config files.
dovecot_versions:
  "24.04": "2.3"
  "26.04": "2.4"

dovecot_version: "{{ dovecot_versions[ansible_distribution_version] }}"

# Where the mailctl Python package is installed (see tasks/install-mailctl.yml)
mailctl_lib: /usr/local/lib/mailctl

# Sending limits for authenticated mail users, counted in recipients per SASL
# login (see templates/postfwd.cf.j2). Keep them ordered from the shortest
# window to the longest, so recipients refused by a short window don't use up
# a longer one.
mail_send_limits:
  - recipients: 300
    seconds: 3600
  - recipients: 1000
    seconds: 86400

# Accounts that need other limits than mail_send_limits, e.g. one that sends a
# newsletter. An empty list means no limit for that account.
mail_send_limits_by_account: {}
#  newsletter@example.com:
#    - recipients: 2000
#      seconds: 3600

# SOGo per Ubuntu release: where it comes from, its packages, and where they put
# SOGo's images, scripts and styles, which OpenLiteSpeed serves directly.
sogo_releases:
  "24.04":
    # Ubuntu 24.04 has no SOGo package: these are SOGo's own (nightly) builds.
    repository: https://packages.sogo.nu/nightly/5/ubuntu
    # SOGo's builds leave the database driver to a package of its own.
    packages: [sogo, sogo-activesync, sope4.9-gdl1-mysql]
    resources: /usr/lib/GNUstep/SOGo/WebServerResources
  "26.04":
    repository: ""
    packages: [sogo, sogo-activesync]
    resources: /usr/share/GNUstep/SOGo/WebServerResources

sogo_release: "{{ sogo_releases[ansible_distribution_version] }}"

# Where SOGo listens. OpenLiteSpeed passes webmail.<domain> on to it.
sogo_address: 127.0.0.1:20000

# SOGo processes. A phone using ActiveSync keeps one busy while it waits for
# changes; the web interface and calendar apps need the others.
sogo_workers: 10

# What new webmail users start with. They can change both.
sogo_language: Dutch
sogo_timezone: Europe/Amsterdam

# OpenLiteSpeed, installed by the web role
ols_root: /usr/local/lsws

# Document root of the webmail sites: it only holds Let's Encrypt's challenges.
webmail_root: /var/www/webmail

# The autoconfig and autodiscover sites (mailctl autodiscover publish): their
# web root, which is also certbot's for them, and the PHP that answers the mail
# programs (installed by the web role).
autodiscover_root: /var/www/mailautodiscover
autodiscover_lsphp: "{{ ols_root }}/lsphp83/bin/lsphp"

# Where Let's Encrypt checks the names in the mail certificate: this server's
# hostname and every mail.DOMAIN (mailctl certificate sync). It holds nothing
# but the challenges.
mailcert_root: /var/www/mailcert

# Email address for the Let's Encrypt account of the webmail certificates, used
# when certbot has no account yet. Without it, the account has no address.
letsencrypt_email: ""

# Brute-force protection for the mail jails (tasks/configure-fail2ban.yml).
# Before banning an address, fail2ban asks /usr/local/sbin/f2b-mail-ignore.sh
# whether it belongs to a customer whose mail client still has an old password
# saved. It exempts the address only if all three thresholds below are met.
#
# These were fitted to one server's traffic and replayed over 30 days of its
# mail log. Re-validate against real logs before changing them; the script's
# comments explain what each one is for.

# Successful logins an address needs before it counts as an established device.
# A password guesser has none, which does most of the work.
f2b_min_success: 2
# Distinct accounts it may be failing on. One phone with several mailboxes
# configured is normal; failing across a dozen accounts is not.
f2b_max_fail_users: 3
# Distinct accounts that don't exist it may try. One covers a client still
# configured for a mailbox that was deleted; attackers probe far more.
f2b_max_invalid_users: 1
# How far back to read when the mail log is the systemd journal.
f2b_log_days: 30
