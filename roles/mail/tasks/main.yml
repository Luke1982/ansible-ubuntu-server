---
# Main mailserver tasks file

- name: Install mailserver packages
  apt:
    pkg:
      - postfix
      - postfix-mysql
      - dovecot-mysql
      - dovecot-imapd
      - dovecot-lmtpd
      - dovecot-managesieved
      - spamassassin
      - spamass-milter
      - roundcube
      - roundcube-plugins
      - opendkim
      - opendkim-tools
      - mariadb-server
      - python3-pymysql
    state: present

- name: Setup mailserver database
  mysql_db:
    encoding: "utf8"
    name: mailserver
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Setup spamassassin database
  mysql_db:
    encoding: "utf8"
    name: spamassassin
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Setup bayes database
  mysql_db:
    encoding: "utf8"
    name: bayes
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Setup the mailserver user
  mysql_user:
    host: localhost
    name: mailuser
    password: "{{ mailuser_db_pass }}"
    priv: "mailserver.*:SELECT,INSERT,UPDATE,DELETE/spamassassin.*:SELECT,INSERT,UPDATE,DELETE/bayes.*:SELECT,INSERT,UPDATE,DELETE"
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Copy over mailserver setup SQL
  copy:
    src: roles/mail/files/setup_mailserver_tables.sql
    dest: /tmp/setup_mailserver_tables.sql
    mode: 0644
    owner: root
    group: root

- name: Copy over spamassassin setup SQL
  copy:
    src: roles/mail/files/setup_spamassassin_tables.sql
    dest: /tmp/setup_spamassassin_tables.sql
    mode: 0644
    owner: root
    group: root

- name: Copy over bayes setup SQL
  copy:
    src: roles/mail/files/setup_bayes_tables.sql
    dest: /tmp/setup_bayes_tables.sql
    mode: 0644
    owner: root
    group: root

- name: Create mailserver database schema
  mysql_db:
    state: import
    name: mailserver
    target: /tmp/setup_mailserver_tables.sql
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create spamassassin database schema
  mysql_db:
    state: import
    name: spamassassin
    target: /tmp/setup_spamassassin_tables.sql
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create bayes database schema
  mysql_db:
    state: import
    name: bayes
    target: /tmp/setup_bayes_tables.sql
    login_unix_socket: /var/run/mysqld/mysqld.sock

# Optional: restore previously learned Bayes data when migrating servers.
# Drop a mysqldump of the old `bayes` database at
# roles/mail/files/private/bayes_dump.sql and it will be imported here.
# See roles/mail/files/private/README.md.
- name: Check for a Bayes dump to restore
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/roles/mail/files/private/bayes_dump.sql"
  delegate_to: localhost
  become: false
  register: bayes_dump

- name: Copy over the Bayes dump
  copy:
    src: roles/mail/files/private/bayes_dump.sql
    dest: /tmp/bayes_dump.sql
    mode: 0644
    owner: root
    group: root
  when: bayes_dump.stat.exists

- name: Restore learned Bayes data
  mysql_db:
    state: import
    name: bayes
    target: /tmp/bayes_dump.sql
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: bayes_dump.stat.exists
  notify: restart spamassassin

- include_tasks: configure-postfix.yml
- include_tasks: configure-fail2ban.yml

- name: Add a group for the virtual mail handling
  group:
    gid: 5000
    name: vmail
    state: present

- name: Add a user for the virtual mailbox handling
  user:
    groups:
      - vmail
    create_home: yes
    home: /var/vmail
    name: vmail
    state: present
    uid: 5000

- name: Create empty certificate files for the host so dovecot can restart without errors
  file:
    path: /etc/letsencrypt/live/{{hostname}}
    state: directory
    group: root
    owner: root

- name: Create empty certificate files for the host so dovecot can restart without errors
  file:
    path: /etc/letsencrypt/live/{{hostname}}/privkey.pem
    state: touch
    group: root
    owner: root

- name: Create empty certificate files for the host so dovecot can restart without errors
  file:
    path: /etc/letsencrypt/live/{{hostname}}/fullchain.pem
    state: touch
    group: root
    owner: root

- include_tasks: configure-dovecot.yml
- include_tasks: configure-roundcube.yml
- include_tasks: configure-spamassassin.yml
- include_tasks: configure-opendkim.yml
