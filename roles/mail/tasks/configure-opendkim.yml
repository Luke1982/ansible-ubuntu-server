---
# Configuration tasks for OpenDKIM

- name: Copy OpenDKIM configuration file
  copy:
    backup: yes
    dest: /etc/opendkim.conf
    group: root
    owner: root
    src: roles/mail/files/opendkim.conf
  notify: restart opendkim

- name: Set the correct run directory for opendkim
  lineinfile:
    path: /etc/default/opendkim
    regexp: RUNDIR\s?=\s?[\w\/]+
    line: RUNDIR=/var/run/opendkim
  notify: restart opendkim

- name: Create OpenDKIM socket directory
  file:
    path: /var/spool/postfix/opendkim/
    state: directory
    owner: opendkim
    group: opendkim
    mode: 0755

- name: Add postfix user to the opendkim group
  user:
    append: yes
    name: postfix
    groups: opendkim
    remove: no
    state: present

- name: Enable opendkim smtpd miltering in Postfix
  replace:
    path: /etc/postfix/main.cf
    regexp: ^smtpd_milters\s?=\s?(unix:\/spamass\/spamass.sock)
    replace: smtpd_milters=\1,unix:/opendkim/opendkim.sock

- name: Enable opendkim non-smtpd miltering in Postfix
  replace:
    path: /etc/postfix/main.cf
    regexp: ^non_smtpd_milters\s?=\s?(unix:\/spamass\/spamass.sock)
    replace: non_smtpd_milters=\1,unix:/opendkim/opendkim.sock

- name: Create directories for OpenDKIM files and tables
  file:
    path: /etc/opendkim/keys
    state: directory
    owner: root
    group: root
    mode: 0755

- name: Setup OpenDKIM TrustedHosts
  template:
    dest: /etc/opendkim/TrustedHosts
    mode: 0644
    owner: root
    group: root
    src: opendkim_TrustedHosts.j2
  notify: restart opendkim

- name: Remove the DKIM setup script that mailctl replaced
  file:
    path: /usr/local/bin/setup_dkim_for_domain.sh
    state: absent

# mailctl rebuilds KeyTable and SigningTable from the keys in /etc/opendkim/keys, so every domain with
# a key stays signed, and reloads OpenDKIM when they change. An existing key is never replaced.
- name: Create a DKIM key for the server's own domain and sign every domain that has a key
  command: mailctl dkim create {{ defaultdomain }}
  register: dkim_create
  changed_when: "'Created a DKIM key' in dkim_create.stdout or 'Updated the OpenDKIM tables' in dkim_create.stdout"
