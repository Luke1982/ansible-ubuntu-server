---
# Postfix configuration file

- name: Prevent postfix from connecting with outdated encryption
  shell:
    cmd: "postconf 'smtpd_tls_mandatory_protocols=!SSLv2,!SSLv3'"

- name: Configure postfix to use lookup domains in MySQL
  template:
    src: "virtual-mailbox-domains.cf.j2"
    dest: "/etc/postfix/virtual-mailbox-domains.cf"

- name: Configure postfix to use lookup mailbox maps in MySQL
  template:
    src: "virtual-mailbox-maps.cf.j2"
    dest: "/etc/postfix/virtual-mailbox-maps.cf"

- name: Configure postfix to use lookup alias maps in MySQL
  template:
    src: "virtual-alias-maps.cf.j2"
    dest: "/etc/postfix/virtual-alias-maps.cf"

- name: Install postfix DB lookup file for sender aliases
  template:
    src: "virtual-sender-maps.cf.j2"
    dest: "/etc/postfix/virtual-sender-maps.cf"

- name: Activate SQL mapping files in postfix
  shell:
    cmd: |
      postconf virtual_mailbox_domains=mysql:/etc/postfix/virtual-mailbox-domains.cf
      postconf virtual_mailbox_maps=mysql:/etc/postfix/virtual-mailbox-maps.cf
      postconf virtual_alias_maps=mysql:/etc/postfix/virtual-alias-maps.cf
      postconf smtpd_sender_login_maps=mysql:/etc/postfix/virtual-sender-maps.cf

- name: Make postfix deliver mail to dovecot's LMTP socket
  shell:
    cmd: "postconf virtual_transport=lmtp:unix:private/dovecot-lmtp"

- name: Make postfix use the FQDN hostname
  shell:
    cmd: "postconf myhostname={{hostname}}"

- name: Make postfix authenticate SMTP requests through Dovecot's SASL mechanism
  shell:
    cmd: |
      postconf smtpd_sasl_type=dovecot
      postconf smtpd_sasl_path=private/auth
      postconf smtpd_sasl_auth_enable=yes

- name: Enable postfix SMTP encryption
  shell:
    cmd: |
      postconf smtpd_tls_security_level=may
      postconf smtpd_tls_auth_only=yes
      postconf smtpd_tls_cert_file=/etc/letsencrypt/live/{{hostname}}/fullchain.pem
      postconf smtpd_tls_key_file=/etc/letsencrypt/live/{{hostname}}/privkey.pem

# Checked in smtpd_relay_restrictions so the sending limits cover ports 25, 465
# and 587 alike. default_action=DUNNO fails open: if postfwd is down, mail goes
# through unlimited instead of all mail, inbound included, being deferred.
- name: Check senders against the postfwd sending limits
  lineinfile:
    path: /etc/postfix/main.cf
    regexp: ^smtpd_relay_restrictions\s*=
    line: smtpd_relay_restrictions = check_policy_service { inet:127.0.0.1:10040, default_action=DUNNO }, permit_mynetworks, permit_sasl_authenticated, defer_unauth_destination
  notify: restart postfix

- name: Place a marker for custom postfix configuration in master.cf
  lineinfile:
    path: /etc/postfix/master.cf
    insertafter: EOF
    line: "## From here configuration is controlled by Ansible"

# Not chrooted ("n"), like the services the package ships in this file: a chrooted service looks for the milter
# sockets and everything else inside /var/spool/postfix, and the rest of Postfix does not, so one path can't be
# right for both.
- name: Setup Postfix submission ports
  blockinfile:
    path: /etc/postfix/master.cf
    insertafter: \#\# From here configuration is controlled by Ansible
    block: |
      submission inet n - n - - smtpd
       -o syslog_name=postfix/submission
       -o smtpd_tls_security_level=encrypt
       -o smtpd_sasl_auth_enable=yes
       -o smtpd_sasl_type=dovecot
       -o smtpd_sasl_path=private/auth
       -o smtpd_sasl_security_options=noanonymous
       -o smtpd_sender_restrictions=reject_sender_login_mismatch
       -o smtpd_sasl_local_domain=$myhostname
       -o smtpd_client_restrictions=permit_sasl_authenticated,reject
       -o smtpd_recipient_restrictions=reject_non_fqdn_recipient,reject_unknown_recipient_domain,permit_sasl_authenticated,reject

      smtps inet n - n - - smtpd
       -o syslog_name=postfix/smtps
       -o smtpd_tls_security_level=encrypt
       -o smtpd_tls_wrappermode=yes
       -o smtpd_sasl_auth_enable=yes
       -o smtpd_sasl_type=dovecot
       -o smtpd_sasl_path=private/auth
       -o smtpd_sasl_security_options=noanonymous
       -o smtpd_sender_restrictions=reject_sender_login_mismatch
       -o smtpd_sasl_local_domain=$myhostname
       -o smtpd_client_restrictions=permit_sasl_authenticated,reject
       -o smtpd_recipient_restrictions=reject_non_fqdn_recipient,reject_unknown_recipient_domain,permit_sasl_authenticated,reject
  notify: restart postfix

# A delivery report is a mail this server sends about a message it has just taken in: "Successful Mail Delivery
# Report", to whoever the message said to report to. Spammers ask for one, so that this server sends their text
# to an address they chose, in our own name and from our own address. Nothing on the internet has any business
# asking us for one, so port 25 no longer offers it (smtpd_discard_ehlo_keywords on that service alone). The
# submission ports, 587 and 465, still offer it: there the sender has logged in, and the mail is one of ours.
#
# postconf -P changes the "smtp inet" line itself, which is above the marker and not in the block Ansible
# writes, so this is how that line is changed rather than by rewriting it here.
- name: Look at what port 25 offers now
  command: postconf -Ph smtp/inet/smtpd_discard_ehlo_keywords
  register: postfix_ehlo
  changed_when: false
  failed_when: false

- name: Don't offer delivery reports (DSN) to the internet on port 25
  command: postconf -P smtp/inet/smtpd_discard_ehlo_keywords=dsn
  when: postfix_ehlo.stdout | default('') | trim != 'dsn'
  notify: restart postfix

- name: Rebuild postfix alias tables
  shell:
    cmd: newaliases