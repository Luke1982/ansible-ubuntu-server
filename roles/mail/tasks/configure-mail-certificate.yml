---
# The certificate Postfix and Dovecot present holds this server's hostname and
# every mail.DOMAIN, so no mail program gets a certificate warning. Let's
# Encrypt checks each of those names over HTTP: this OpenLiteSpeed template
# answers for them, with a web root that holds nothing but the challenges.
# "mailctl certificate sync" keeps the members and the certificate in step.

- name: Check that OpenLiteSpeed is installed
  stat:
    path: "{{ ols_root }}/conf/httpd_config.conf"
  register: ols_config_for_mail_certificate

- name: Stop when OpenLiteSpeed isn't installed
  assert:
    that: ols_config_for_mail_certificate.stat.exists
    fail_msg: "{{ ols_root }}/conf/httpd_config.conf doesn't exist. Run the web role first: it installs OpenLiteSpeed."
    quiet: yes

- name: Create the web root for Let's Encrypt's checks of the mail names
  file:
    path: "{{ mailcert_root }}/.well-known/acme-challenge"
    state: directory
    mode: 0755

- name: Install the OpenLiteSpeed template for the mail names
  template:
    src: openlitespeed-mailnames.conf.j2
    dest: "{{ ols_root }}/conf/templates/mailnames.conf"
    owner: lsadm  # like everything in OpenLiteSpeed's conf directory
    mode: 0644
  notify: restart openlitespeed

# The certificate is brought up to date by "mailctl certificate sync", by hand:
# it asks certbot for a certificate and makes Postfix and Dovecot read it, so a
# playbook run never does it.
- name: Say that the mail certificate is brought up to date by hand
  debug:
    msg: >-
      The mail certificate is left as it is. Run "mailctl certificate sync" on the server to put the hostname and
      every mail.DOMAIN that points here in one certificate, and to see which names need attention.
