---
# webmail.<domain> for every mail domain, served by OpenLiteSpeed. Its listeners
# and sites are set up by hand in WebAdmin; "mailctl webmail sync" adds a
# virtual host of its own per domain to that config, marked with its note, and
# leaves everything else alone.

- name: Check that OpenLiteSpeed is installed
  stat:
    path: "{{ ols_root }}/conf/httpd_config.conf"
  register: ols_config

- name: Stop when OpenLiteSpeed isn't installed
  assert:
    that: ols_config.stat.exists
    fail_msg: "{{ ols_root }}/conf/httpd_config.conf doesn't exist. Run the web role first: it installs OpenLiteSpeed."
    quiet: yes

# An earlier version of this role included files in OpenLiteSpeed's config,
# which makes WebAdmin show all of it read-only. mailctl now keeps each site's
# settings where WebAdmin does, conf/vhosts/<site>/vhconf.conf, as lsadm.
- name: Remove the include lines of the earlier webmail setup
  replace:
    path: "{{ ols_root }}/conf/httpd_config.conf"
    regexp: ^# BEGIN webmail (sites|names for listener \S+), managed by Ansible\n.*\n# END webmail .*, managed by Ansible\n
  notify: restart openlitespeed

# A link in its place is removed itself, not what it points to.
- name: Remove the files of the earlier webmail setup
  file:
    path: "{{ ols_root }}/conf/webmail"
    state: absent

- name: Create the webmail document root, for Let's Encrypt's challenges
  file:
    path: "{{ webmail_root }}/.well-known/acme-challenge"
    state: directory
    mode: 0755

# The webmail sites are set up by every playbook run and by "mailctl webmail
# sync" by hand, not on a timer. An earlier version of this role installed a
# daily timer: it goes.
- name: Check for the daily webmail sync of an earlier version
  stat:
    path: /etc/systemd/system/mailctl-webmail-sync.timer
  register: webmail_sync_timer

- name: Stop the daily webmail sync of an earlier version
  systemd:
    name: mailctl-webmail-sync.timer
    enabled: no
    state: stopped
  when: webmail_sync_timer.stat.exists

- name: Remove the daily webmail sync of an earlier version
  file:
    path: /etc/systemd/system/{{ item }}
    state: absent
  loop:
    - mailctl-webmail-sync.service
    - mailctl-webmail-sync.timer
  register: webmail_sync_units

- name: Let systemd forget the daily webmail sync
  systemd:
    daemon_reload: yes
  when: webmail_sync_units.changed

# Restarts OpenLiteSpeed itself when it changes a site. Ansible gives commands
# a terminal, and mailctl asks questions in one (like the TransIP login when
# there is none), which nobody would answer: input from /dev/null tells it not
# to ask.
- name: Set up webmail for the domains whose webmail name points here
  shell: mailctl webmail sync </dev/null
  register: webmail_sync
  changed_when: "'Changed the webmail sites.' in webmail_sync.stdout"

# Where another earlier version kept the sites' settings; the sync above has
# moved them to conf/vhosts.
- name: Remove the site settings of an earlier version
  file:
    path: /etc/mailctl/webmail
    state: absent

# Its warnings: domains waiting for their webmail record, refused certificates.
# (With --check the sync doesn't run, so there's no output.)
- name: Show the webmail sites that need attention
  debug:
    msg: "{{ webmail_warnings }}"
  when: webmail_warnings | length > 0
  vars:
    webmail_warnings: "{{ webmail_sync.stdout_lines | default([]) | select('match', '^!') | list }}"
