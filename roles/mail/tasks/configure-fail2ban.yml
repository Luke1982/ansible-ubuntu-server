---

# The ignorecommand below calls gawk (mawk, Ubuntu's default awk, won't do) and
# a mysql client, to read which mail accounts exist. mariadb-server brings a
# client along, but naming it keeps the dependency visible: without one the
# script has no account list, fails closed, and quietly bans everybody.
- name: Install what the mail ignorecommand needs
  apt:
    pkg:
      - gawk
      - mariadb-client
    state: present

# fail2ban's rule -- so many failures in so long, then ban -- cannot tell a
# password guesser from a customer's phone that still has last week's password
# saved and retries it every few minutes forever. In the log they look the
# same. This script answers that question for the dovecot and postfix jails,
# which ban permanently; the script explains how it decides.
#
# Not a template: the script is full of ${...} and awk braces.
- name: Install the mail brute-force ignorecommand
  copy:
    src: f2b-mail-ignore.sh
    dest: /usr/local/sbin/f2b-mail-ignore.sh
    mode: 0755
    owner: root
    group: root

# fail2ban runs the script afresh for every ban it considers, so neither this
# nor the script itself needs a restart to take effect.
- name: Set the thresholds for the mail brute-force ignorecommand
  template:
    src: f2b-mail-ignore.j2
    dest: /etc/default/f2b-mail-ignore
    mode: 0644
    owner: root
    group: root

- name: Install postfix fail2ban jail
  copy:
    src: jail-postfix.conf
    dest: /etc/fail2ban/jail.d/postfix.conf
    mode: 0644
    owner: root
    group: root
  notify: restart fail2ban

- name: Install dovecot fail2ban jail
  copy:
    src: jail-dovecot.conf
    dest: /etc/fail2ban/jail.d/dovecot.conf
    mode: 0644
    owner: root
    group: root
  notify: restart fail2ban

# The dovecot filter in Ubuntu 26.04's fail2ban 1.1.0 doesn't recognise Dovecot
# 2.4's failed logins ("Login aborted: ... (auth failed, ...) (auth_failed)"),
# so nothing gets banned. fail2ban's newer filter does, and still matches 2.3.
- name: Install a dovecot fail2ban filter that recognises Dovecot 2.4
  copy:
    src: filter-dovecot.local
    dest: /etc/fail2ban/filter.d/dovecot.local
    mode: 0644
    owner: root
    group: root
  when: dovecot_version == "2.4"
  notify: restart fail2ban

- name: Install the SOGo fail2ban jail
  copy:
    src: jail-sogo-auth.conf
    dest: /etc/fail2ban/jail.d/sogo-auth.conf
    mode: 0644
    owner: root
    group: root
  notify: restart fail2ban

# Bans the address OpenLiteSpeed saw instead of one the client made up.
- name: Install a SOGo fail2ban filter that bans the real client
  copy:
    src: filter-sogo-auth.local
    dest: /etc/fail2ban/filter.d/sogo-auth.local
    mode: 0644
    owner: root
    group: root
  notify: restart fail2ban

# fail2ban won't start with a jail whose log doesn't exist yet.
- name: Make sure SOGo's log exists
  copy:
    content: ""
    dest: /var/log/sogo/sogo.log
    force: no
    owner: sogo
    group: sogo
    mode: 0640

# An earlier draft of this role installed the postfix ones. postfix-sasl.conf
# points at a filter that doesn't exist in fail2ban 1.0, which stops fail2ban
# from starting. SOGo replaced Roundcube.
- name: Remove superseded fail2ban jails
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/fail2ban/jail.d/postfix-sasl.conf
    - /etc/fail2ban/jail.d/postfix-rate.conf
    - /etc/fail2ban/filter.d/postfix-rate.conf
    - /etc/fail2ban/jail.d/roundcube-auth.conf
  notify: restart fail2ban
