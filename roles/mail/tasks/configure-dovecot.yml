---
# Special file for configuring dovecot

- name: Disable regular authentication in dovecot
  replace:
    path: /etc/dovecot/conf.d/10-auth.conf
    regexp: ^!include auth-system.conf.ext
    replace: "#!include auth-system.conf.ext"

- name: Enable SQL authentication in dovecot
  replace:
    path: /etc/dovecot/conf.d/10-auth.conf
    regexp: \#(!include auth-sql.conf.ext)
    replace: \g<1>

- name: Setup Dovecot SQL configuration file
  template:
    src: dovecot-sql.conf.ext.j2
    dest: /etc/dovecot/dovecot-sql.conf.ext
    owner: root
    group: root
    backup: yes
  when: dovecot_version == "2.3"

- name: Replace Dovecot SQL authentication file
  copy:
    backup: yes
    src: roles/mail/files/dovecot-auth-sql.conf.ext
    dest: /etc/dovecot/conf.d/auth-sql.conf.ext
    owner: root
    group: root
  when: dovecot_version == "2.3"

# Holds the database password, so it isn't readable by everyone
- name: Setup Dovecot SQL authentication file with the database connection
  template:
    backup: yes
    src: dovecot-auth-sql-2.4.conf.ext.j2
    dest: /etc/dovecot/conf.d/auth-sql.conf.ext
    owner: root
    group: dovecot
    mode: 0640
  when: dovecot_version == "2.4"
  notify: restart dovecot

# Left behind by the 2.3 config: Dovecot 2.4 won't start with this line
- name: Remove the old sieve_after line from 90-sieve.conf
  lineinfile:
    path: /etc/dovecot/conf.d/90-sieve.conf
    regexp: ^sieve_after\s*=
    state: absent
  when: dovecot_version == "2.4"
  notify: restart dovecot

# Left behind by the 2.3 config: unused by 2.4, and they hold the database password
- name: Remove the old Dovecot SQL configuration files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/dovecot/dovecot-sql.conf.ext
    - /etc/dovecot/dovecot-dict-sql.conf.ext
  when: dovecot_version == "2.4"

# Login times for mailctl: Dovecot's last_login plugin writes them to the last_login table.
# Both files hold the database password.
- name: Setup Dovecot login tracking (2.3)
  template:
    src: dovecot-dict-sql-2.3.conf.ext.j2
    dest: /etc/dovecot/dovecot-dict-sql.conf.ext
    owner: root
    group: dovecot
    mode: 0640
  when: dovecot_version == "2.3"
  notify: restart dovecot

- name: Setup Dovecot login tracking (2.4)
  template:
    src: dovecot-last-login-2.4.conf.j2
    dest: /etc/dovecot/conf.d/95-last-login.conf
    owner: root
    group: dovecot
    mode: 0640
  when: dovecot_version == "2.4"
  notify: restart dovecot

# Dovecot keeps a row per IP address an account logs in from; mailctl only shows the newest.
- name: Remove superseded login times every night
  cron:
    name: prune last_login
    cron_file: mailctl-prune-last-login
    user: root
    hour: "3"
    minute: "45"
    job: >-
      mariadb mailserver -e 'DELETE old FROM last_login old JOIN last_login newer
      ON newer.userid = old.userid AND newer.service = old.service AND newer.last_access > old.last_access'

- name: Copy over local Dovecot conf file
  template:
    src: "dovecot-local-{{ dovecot_version }}.conf.j2"
    dest: /etc/dovecot/local.conf
  notify:
    - restart dovecot
    - index mailboxes

# fts-xapian only drops deleted mail from its index when the index is optimized.
- name: Remove deleted mail from the search indexes every night
  cron:
    name: dovecot fts optimize
    cron_file: dovecot-fts-optimize
    user: root
    hour: "3"
    minute: "30"
    job: doveadm fts optimize -A

- name: Enable sieve_after in Dovecot
  lineinfile:
    path: /etc/dovecot/conf.d/90-sieve.conf
    regexp: \s{0,4}#sieve_after\s?=\s?\w*
    line: sieve_after = /etc/dovecot/sieve-after
  when: dovecot_version == "2.3"

- name: Copy over sieve config file for general spam handling
  copy:
    src: roles/mail/files/spam-to-folder.sieve
    dest: /etc/dovecot/sieve-after/

- name: Compile sieve spamrule for Dovecot
  shell:
    cmd: sievec /etc/dovecot/sieve-after/spam-to-folder.sieve
  notify: restart dovecot

- name: Create Letsencrypt hooks directory
  file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root

- name: Install post-deploy hook in Letsencrypt to reload dovecot
  template:
    src: "1-post-deploy-hook-letsencrypt.sh.j2"
    dest: /etc/letsencrypt/renewal-hooks/deploy/1-post-deploy-hook.sh