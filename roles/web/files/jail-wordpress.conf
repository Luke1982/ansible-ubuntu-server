# WordPress password guessing, for every site on this server at once.
#
# The WP fail2ban plugin, which "domainctl wp install" puts on every WordPress site, doesn't write to a site's own
# logs: it sends each failure to syslog, as "wordpress(example.nl)[pid]: Authentication failure for admin from
# 1.2.3.4", and journald keeps it. Every site's PHP ends up in the same journal, so these two jails cover every
# site, and a new site needs nothing here. A site without the plugin logs nothing and isn't protected:
# "domainctl wp check" finds those.
#
# The plugin logs these on the auth facility (4); matching only that keeps fail2ban from reading the whole journal.

# Things no person does by accident: a login blocked by the plugin itself, user enumeration, XML-RPC multicall
# guessing, spam. One is enough.
[wordpress-hard]
enabled      = true
filter       = wordpress-hard
backend      = systemd
journalmatch = SYSLOG_FACILITY=4
port         = http,https
maxretry     = 1
findtime     = 600
bantime      = 1d

# Wrong passwords and unknown users: what a guesser does, but also a customer who mistyped. So, like the webmail
# jail, a few tries and an hour, which stops a guesser without locking a customer out for long.
[wordpress-soft]
enabled      = true
filter       = wordpress-soft
backend      = systemd
journalmatch = SYSLOG_FACILITY=4
port         = http,https
maxretry     = 5
findtime     = 600
bantime      = 1h
