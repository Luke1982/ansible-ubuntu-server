---
# Web role tasks

- name: Check that this Ubuntu release is supported
  assert:
    that: ansible_distribution_version in php_versions
    fail_msg: "Ubuntu {{ ansible_distribution_version }} isn't supported: roles/web/defaults/main.yml has no PHP version for it."
    quiet: yes

- name: Install certbot and git
  apt:
    pkg:
      - certbot
      - git
    state: present

- include_tasks: setup-openlitespeed.yml
- include_tasks: setup-webhosting.yml

- name: Install PHP and some PHP modules
  apt:
    pkg:
      - "php{{ php_version }}"
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-mysql"
      - "php{{ php_version }}-gd"
      - "php{{ php_version }}-imagick"
      - "php{{ php_version }}-xml"
      - "php{{ php_version }}-zip"
      - "php{{ php_version }}-intl"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-curl"
    state: present

# The imap extension was removed from PHP 8.4, so Ubuntu no longer packages it
- name: Install the PHP imap module
  apt:
    pkg: "php{{ php_version }}-imap"
    state: present
  when: php_version is version('8.4', '<')

- name: Create Let's Encrypt's live directory
  file:
    path: /etc/letsencrypt/live
    state: directory
    owner: root
    group: root
    mode: 0600

- include_tasks: setup-php-fpm.yml

- name: Download Composer installer
  get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-setup.php
    mode: 0644

- name: Install Composer globally
  command: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
  args:
    creates: /usr/local/bin/composer

- name: Install nvm system-wide
  git:
    repo: https://github.com/nvm-sh/nvm.git
    dest: /usr/local/nvm
    version: v0.40.1
    # Skip nvm's extra repos: they only hold its developers' test files, and downloading them needs a GitHub SSH key
    recursive: no

- name: Make nvm available to all users
  copy:
    dest: /etc/profile.d/nvm.sh
    mode: 0755
    owner: root
    group: root
    content: |
      export NVM_DIR="/usr/local/nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
- include_tasks: setup-domainctl.yml

# The sites themselves are added with "domainctl add DOMAIN". This only brings what is already there up to date:
# the template block in OpenLiteSpeed's config, the redirect to HTTPS, and each site's file permissions.
- name: Bring the sites up to date
  command: domainctl sync
  register: domainctl_sync
  changed_when: "'Changed the web sites' in domainctl_sync.stdout"

- name: Show what domainctl sync did
  debug:
    var: domainctl_sync.stdout_lines
