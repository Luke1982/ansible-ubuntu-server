---
# Web role tasks

- name: Install certbot and git
  apt:
    pkg:
      - certbot
      - git
    state: present

- include_tasks: setup-openlitespeed.yml

- name: Install PHP and some PHP modules
  apt:
    pkg:
      - php8.3
      - php8.3-fpm
      - php8.3-cli
      - php8.3-mysql
      - php8.3-gd
      - php8.3-imagick
      - php8.3-xml
      - php8.3-zip
      - php8.3-intl
      - php8.3-mbstring
      - php8.3-curl
      - php8.3-imap
    state: present

- name: Create Let's Encrypt's live directory
  file:
    path: /etc/letsencrypt/live
    state: directory
    owner: root
    group: root
    mode: 0600

- include_tasks: setup-php-fpm.yml

- name: Download Composer installer
  get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-setup.php
    mode: 0644

- name: Install Composer globally
  command: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
  args:
    creates: /usr/local/bin/composer

- name: Install nvm system-wide
  git:
    repo: https://github.com/nvm-sh/nvm.git
    dest: /usr/local/nvm
    version: v0.40.1

- name: Make nvm available to all users
  copy:
    dest: /etc/profile.d/nvm.sh
    mode: 0755
    owner: root
    group: root
    content: |
      export NVM_DIR="/usr/local/nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"