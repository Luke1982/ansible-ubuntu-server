---
# Setup Openlitespeed
# http://rpms.litespeedtech.com/debian/dists/noble/main/binary-amd64/Packages

- name: Setup openlitespeed repository
  shell: sudo wget -O - https://repo.litespeed.sh | sudo bash

- name: Install openlitespeed
  apt:
    pkg:
      - openlitespeed
      - lsphp83
      - lsphp83-mysql
      - lsphp83-common
      - lsphp83-curl
      - lsphp83-imap
      - lsphp83-imagick
      - lsphp83-memcached
      - lsphp83-opcache
      - lsphp83-redis
      - lsphp83-tidy
      - lsphp83-intl
    state: present

# WebAdmin, on port 7080, gets the opcache settings of the sites' PHP (lsphp83's mods-available/opcache.ini), but
# OpenLiteSpeed always caps the panel's PHP at 500 MB of memory. An opcache sized for the sites doesn't fit in that
# (512 MB doesn't, and 256 MB didn't either), and the panel's PHP then crashes on every start: a 503 on port 7080.
# The panel doesn't need opcache, so it is off there, whatever the sites have. An OpenLiteSpeed upgrade can replace
# this php.ini; the next playbook run puts the line back.
- name: Turn opcache off for WebAdmin's PHP
  ini_file:
    path: "{{ ols_root }}/admin/conf/php.ini"
    section: opcache
    option: opcache.enable
    value: "0"
    no_extra_spaces: yes
  notify: restart openlitespeed

# OpenLiteSpeed comes with one listener, on port 8088. Everything on these servers expects the usual two: Let's
# Encrypt checks a name over plain HTTP on 80, and every site is served on 443. They are added here rather than
# by hand in WebAdmin, so a new server doesn't fail halfway through the playbook on a step nobody remembers.
#
# A site brings its own certificate (vhssl), so the one on the listener is only served to a name that matches no
# site; a self-signed one is enough for that, and a browser never sees it in normal use.
- name: Look at the listeners OpenLiteSpeed has
  slurp:
    src: "{{ ols_root }}/conf/httpd_config.conf"
  register: ols_listeners

- name: Make a certificate for the HTTPS listener
  command: >-
    openssl req -x509 -newkey rsa:2048 -nodes -days 3650
    -keyout {{ ols_root }}/conf/listener.key -out {{ ols_root }}/conf/listener.crt
    -subj "/CN={{ hostname }}"
  args:
    creates: "{{ ols_root }}/conf/listener.crt"
  when: not ols_listeners.content | b64decode | regex_search('(?m)^\\s*address\\s+\\S*:443\\s*$')

- name: Keep the listener's key to OpenLiteSpeed
  file:
    path: "{{ ols_root }}/conf/listener.key"
    owner: lsadm
    group: lsadm
    mode: 0600
  when: not ols_listeners.content | b64decode | regex_search('(?m)^\\s*address\\s+\\S*:443\\s*$')

- name: Add the listener for port 80
  blockinfile:
    path: "{{ ols_root }}/conf/httpd_config.conf"
    marker: "# {mark} ANSIBLE MANAGED: listener on port 80"
    block: |
      listener HTTP{
        address                 *:80
        secure                  0
      }
  when: not ols_listeners.content | b64decode | regex_search('(?m)^\\s*address\\s+\\S*:80\\s*$')
  notify: restart openlitespeed

- name: Add the listener for port 443
  blockinfile:
    path: "{{ ols_root }}/conf/httpd_config.conf"
    marker: "# {mark} ANSIBLE MANAGED: listener on port 443"
    block: |
      listener HTTPS{
        address                 *:443
        secure                  1
        keyFile                 {{ ols_root }}/conf/listener.key
        certFile                {{ ols_root }}/conf/listener.crt
        certChain               0
      }
  when: not ols_listeners.content | b64decode | regex_search('(?m)^\\s*address\\s+\\S*:443\\s*$')
  notify: restart openlitespeed
