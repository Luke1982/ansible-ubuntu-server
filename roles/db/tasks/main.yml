---
# Main DB tasks

- name: Install MariaDB
  apt:
    pkg:
      - mariadb-server
    state: present

- include_tasks: setup-phpmyadmin.yml

- name: Copy custom mysql config file over
  copy:
    src: roles/db/files/my.cnf
    dest: /etc/my.cnf
    mode: 0644
    owner: root
    group: root
  notify: restart mysql
