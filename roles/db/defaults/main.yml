---

# OpenLiteSpeed, installed by the web role
ols_root: /usr/local/lsws

# phpMyAdmin: where its files are, and the site that serves them. The site's name
# needs an A record (and an AAAA record) pointing to this server.
phpmyadmin_root: /var/www/phpmyadmin
phpmyadmin_host: "pma.{{ hostname }}"

# LiteSpeed's PHP, which runs phpMyAdmin (installed by the web role), and the
# user it runs as: OpenLiteSpeed's own, which needs to write phpMyAdmin's
# temporary directory.
phpmyadmin_lsphp: "{{ ols_root }}/lsphp83/bin/lsphp"
phpmyadmin_user: nobody
phpmyadmin_group: nogroup

# A certificate of its own for the phpMyAdmin site. The playbook asks Let's
# Encrypt for one as soon as the site's name points to this server, through the
# site itself; until then OpenLiteSpeed serves the site with the certificate on
# its HTTPS listener. Set it to no to keep it that way.
phpmyadmin_certificate: yes
letsencrypt_dir: /etc/letsencrypt

# --- Tuning for this machine -------------------------------------------------
# How much memory the server has, which the settings below are worked out from. It is read from the server
# itself; a VPS that reports the whole host instead of its own share gets the real number in its inventory
# file, which wins over this. The web role has the same setting, for the same reason.
server_memory_mb: "{{ ansible_memtotal_mb }}"
# What InnoDB keeps the databases in: a sixteenth of the machine's memory, in whole steps of 256 MB, rounded
# up -- MariaDB rounds what it is given up to a multiple of its own chunk size anyway, so a round number here
# is the number it really uses. These servers run the sites and the mail as well, and the databases on them
# come to a gigabyte or two, so the usual advice of half the machine would be memory nothing reads. MariaDB
# is installed with 128 MB, little enough that it reads the disk for pages it had a moment ago.
db_buffer_pool_mb: "{{ ((server_memory_mb | int) / 16 / 256) | round(0, 'ceil') | int * 256 }}"
# The redo log InnoDB writes every change to before it reaches the data files: a quarter of the buffer pool,
# and never less than MariaDB's own 96 MB. A log too small for what a busy minute writes makes InnoDB stop
# and flush over and over; a big one costs disk and a slower start after a crash.
db_log_file_mb: "{{ [(db_buffer_pool_mb | int) // 4, 96] | max }}"
# How big a temporary table a query that sorts or groups may build in memory before it is written to disk
# instead. MariaDB uses whichever of the two settings is smaller, so they are one number here.
db_tmp_table_mb: 64
# How many clients may be connected at once. MariaDB's own limit is 151, which SOGo alone can reach: each of
# its workers (sogo_workers in the mail role, raised on a server with many phones on ActiveSync) keeps
# connections of its own, and the websites, the mail server and phpMyAdmin connect as well. A connection that
# sits idle still costs a little memory, so this is not a number to raise for its own sake.
db_max_connections: 300
# A dump of every database, every night, by a user MariaDB knows by its Linux
# name (unix_socket): no password anywhere, and read rights only. The dumps are
# gzipped in its home directory, and the ones older than this many days go.
db_backup_user: dbbackups
db_backup_home: /home/dbbackups
db_backup_keep_days: 14
# At two, because the NAS starts copying /home at three: the dumps it finds there are then
# tonight's, and not last night's half-written. Both hours are kept apart on purpose; the NAS's
# own schedule is set on the NAS.
db_backup_time: "02:00:00"

# Email address for the Let's Encrypt account, used when certbot has no account
# yet. Without it, the account has no address.
letsencrypt_email: ""
