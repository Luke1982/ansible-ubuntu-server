---

- name: Copy IPtables setup script over
  template:
    src: start_firewall.sh.j2
    dest: /usr/local/bin/start_firewall.sh
    mode: 0755
    owner: root
    group: root
  notify: restart firewall

- name: Install the systemd unit that applies the firewall at boot
  copy:
    src: firewall.service
    dest: /etc/systemd/system/firewall.service
    mode: 0644
    owner: root
    group: root

- name: Enable and start the firewall service
  systemd:
    name: firewall
    enabled: yes
    state: started
    daemon_reload: yes

- name: Install fail2ban
  apt:
    pkg:
      - fail2ban
    state: present

# The jails themselves are the web and mail roles'; this is the one setting that holds for all of them.
- name: Set the addresses fail2ban never bans
  template:
    src: fail2ban-ignoreip.conf.j2
    dest: /etc/fail2ban/jail.d/ignoreip.conf
    mode: 0644
    owner: root
    group: root
  notify: restart fail2ban
