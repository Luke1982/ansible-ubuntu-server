# Example inventory for one server.
#
# Copy this file to private/<hostname>.yml and fill in your values:
#
#   mkdir -p private
#   cp inventory-example.yml private/web01.example.com.yml
#
# ansible.cfg loads every file in private/ as one inventory, so you run a
# server's playbook without -i:
#
#   ansible-playbook web01.example.com.yml
#
# That playbook selects this server by name (hosts: web01.example.com), so the
# name under "hosts:" below must match it exactly.
all:
  hosts:
    # The server's inventory name. Use its FQDN, the same as its playbook name.
    web01.example.com:

      # --- Connection ---------------------------------------------------------
      # Set these on the host, not in an "all: vars:" section. Every file in
      # private/ is merged into one inventory, so a value under "all: vars:"
      # in one file would apply to every server.

      # IP address (or DNS name) Ansible connects to over SSH.
      ansible_host: 192.168.1.10
      # The user created in step 1 of the README, with passwordless sudo.
      ansible_user: ansible
      # Private key matching the public key you copied with ssh-copy-id.
      ansible_ssh_private_key_file: ~/.ssh/id_rsa
      ansible_python_interpreter: /usr/bin/python3

      # --- basic role (every server) ------------------------------------------
      # Hostname to give the server. Usually the same as the name above.
      # The mail role also uses it as the mail server's FQDN (Postfix, Dovecot,
      # SOGo's outgoing mail and the Let's Encrypt certificate path).
      hostname: "web01.example.com"
      # DNS servers the firewall allows lookups to, separated by spaces.
      # Check /etc/resolv.conf on the server; 127.0.0.53 is systemd-resolved.
      dns_servers: 127.0.0.53

      # --- Backups to the NAS (only if a NAS copies this server) --------------
      # The public key the NAS (Synology Active Backup for Business) logs in
      # with, as one line. With it, the playbook makes the nasbackup user, which
      # may read /home and /var/vmail over rsync and do nothing else; without it,
      # none of that is set up. Make the key pair on the server with
      # "ssh-keygen -t ed25519 -f nas_ed25519 -C nasbackup@<hostname>", load the
      # private key into the NAS, paste the .pub line here, and delete the
      # private key from the server. See "Backups to the NAS" in the README.
      # nas_backup_key: "ssh-ed25519 AAAA... nasbackup@web01.example.com"

      # --- How big this machine is (only when it reports it wrong) ------------
      # The number of cores and the amount of memory decide how many PHP
      # processes serve the sites, how much compiled PHP is held in memory and
      # how much of the databases MariaDB keeps there. Ansible reads both from
      # the server itself, so these two are only for a VPS that reports the
      # whole host instead of its own share. Check with "nproc" and "free -m".
      # server_cpus: 8
      # server_memory_mb: 32089

      # --- mail role (only if the playbook includes it) -----------------------
      # Primary mail domain, used to create the DKIM key and by SpamAssassin.
      # Leave it out for servers without mail.
      defaultdomain: example.com
      # What the browser tab says above webmail. "Webmail" when left out.
      sogo_page_title: "Example Webmail"

      # --- office role (only if the playbook includes it) ---------------------
      # Collabora Online is served at office.<this domain>, and every Nextcloud
      # on this server at a name under it (NAME.office.<this domain>). The mail
      # domain above is used when this is left out.
      # office_domain: example.com
      # Set this to no to keep the playbook from publishing that name's DNS
      # record at TransIP and asking Let's Encrypt for its certificate.
      # "officectl endpoint" on the server does the same thing when you are
      # there to read what it says.
      # office_endpoint: yes
      # Nextclouds on this server that officectl didn't make -- an older one, set
      # up by hand at a name of its own. Collabora keeps letting these in, so the
      # people using them can still open a document.
      # office_other_nextclouds:
      #   - nc.example.com
